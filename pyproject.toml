[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agentrgb"
version = "0.1.0.dev0"
description = "Local agent activity indicators for RGB devices"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
agentrgb = "agentrgb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
