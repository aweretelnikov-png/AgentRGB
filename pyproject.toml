[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentrgb"
version = "0.1.0"
description = "Local agent activity indicators for RGB devices"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
agentrgb = "agentrgb.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentrgb", "agentrgb.*"]
